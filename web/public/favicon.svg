<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4219f"/>
      <stop offset="1" stop-color="#6d1bb5"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff2a2a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="streakR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- road / rails converging to the horizon -->
  <path d="M206 512 L246 330 M306 512 L266 330" stroke="#fff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
  <!-- slipstream: curved streaks pulled in behind the tram -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 300 C120 290 160 250 178 200" stroke="url(#streak)" stroke-width="10"/>
    <path d="M20 380 C110 370 165 330 186 280" stroke="url(#streak)" stroke-width="8"/>
    <path d="M60 440 C130 430 175 400 196 350" stroke="url(#streak)" stroke-width="6"/>
    <path d="M472 300 C392 290 352 250 334 200" stroke="url(#streakR)" stroke-width="10"/>
    <path d="M492 380 C402 370 347 330 326 280" stroke="url(#streakR)" stroke-width="8"/>
    <path d="M452 440 C382 430 337 400 316 350" stroke="url(#streakR)" stroke-width="6"/>
  </g>
  <!-- pantograph -->
  <path d="M232 132 L256 104 L280 132 M240 104 H272" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- tram, seen from behind -->
  <rect x="190" y="132" width="132" height="200" rx="30" fill="#fff"/>
  <rect x="206" y="152" width="100" height="78" rx="14" fill="#5a1494" fill-opacity="0.85"/>
  <rect x="214" y="248" width="84" height="14" rx="7" fill="#e9d5f5"/>
  <rect x="198" y="316" width="116" height="16" rx="6" fill="#ded0ea"/>
  <!-- tail lights -->
  <circle cx="214" cy="292" r="44" fill="url(#glow)"/>
  <circle cx="298" cy="292" r="44" fill="url(#glow)"/>
  <rect x="202" y="282" width="24" height="20" rx="6" fill="#ff2d2d"/>
  <rect x="286" y="282" width="24" height="20" rx="6" fill="#ff2d2d"/>
</svg>
