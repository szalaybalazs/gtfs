query Vehicles($bbox: BboxInput) {
  vehiclePositions(bbox: $bbox) {
    id
    latitude
    longitude
    bearing
    vehicleLabel
    vehicleLicensePlate
    vehicleModel
    tripStartDate
    timestamp
    trip {
      tripId
      headsign
      route { routeId shortName color textColor type }
    }
  }
}
