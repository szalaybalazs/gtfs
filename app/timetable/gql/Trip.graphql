query Trip($id: ID!, $serviceDate: String) {
  trip(id: $id, serviceDate: $serviceDate) {
    tripId
    serviceDate
    headsign
    route { routeId shortName color textColor type }
    vehicle { latitude longitude bearing vehicleLabel vehicleLicensePlate vehicleModel vehicleWheelchairAccessible timestamp }
    stops {
      stopSequence
      arrival
      departure
      arrivalDelay
      departureDelay
      realtime
      stop { stopId name lat lon station { stationId } }
    }
  }
}
