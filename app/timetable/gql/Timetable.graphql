query Timetable($stopId: ID!, $routeId: ID!, $range: RangeInput) {
  timetable(stopId: $stopId, routeId: $routeId, range: $range) {
    arrival
    departure
    serviceId
    tripId
    wheelchairAccessible
    bikesAllowed
    arrivalDelay
    departureDelay
    scheduleRelationship
    isNext
    isPast
  }
}
