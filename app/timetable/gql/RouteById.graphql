query RouteById($routeId: ID!) {
  route(id: $routeId) {
    routeId
    shortName
    longName
    desc
    color
    textColor
    type
    flags {
      lowFloor
      circular
      demandResponsive
      frontDoor
      replacement
    }
    directions {
      headsign
      directionId
      stops {
        stopId
        name
      }
    }
  }
}
